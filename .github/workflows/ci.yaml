name: "Benchmark"

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: "benchmark"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses]

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: github.event_name == 'pull_request'
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning]

      - name: "Install native dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev python3

      - name: "cargo build"
        run: cargo build --release

      - name: "Run benchmarks"
        run: bash .github/scripts/run-benchmarks.sh results.csv

      - name: "Generate results"
        run: python3 .github/scripts/render-results.py results.csv > results.md

      - name: "Update README"
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/render-results.py results.csv --readme README.md

      - name: "Commit README"
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update GitHub runner benchmark results"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: "Publish PR comment"
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '<!-- bigint-benchmark-results -->'
            echo '## Benchmark results'
            echo
            cat results.md
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md --edit-last --create-if-none